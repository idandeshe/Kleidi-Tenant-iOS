# Xcode project spec — run `xcodegen generate` (brew install xcodegen) to produce
# KleidiTenant.xcodeproj. The generated project is not committed; this file is the source.
# Mirrors the staff app (kleidi-ios/project.yml); the tenant app is phone-only.
name: KleidiTenant
options:
  bundleIdPrefix: app.kleidi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Stage: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    # Bump on every TestFlight upload; the server's TENANT_IOS_MIN_SUPPORTED_BUILD compares against it.
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: "99KYXV57BL"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # iPhone only (the staff app is "1,2").
    TARGETED_DEVICE_FAMILY: "1"

packages:
  TenantKit:
    path: Packages/TenantKit

targets:
  KleidiTenant:
    type: application
    platform: iOS
    sources:
      - path: App
    configFiles:
      Debug: Config/Dev.xcconfig
      Stage: Config/Stage.xcconfig
      Release: Config/Prod.xcconfig
    # PRODUCT_BUNDLE_IDENTIFIER comes from Config/*.xcconfig (one app id per environment,
    # so dev, stage and prod builds can sit side by side on a phone).
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kleidi Tenant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, el]
        KleidiAPIBaseURL: $(KLEIDI_API_BASE_URL)
        KleidiEnvironment: $(KLEIDI_ENVIRONMENT)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait only: App Store validation then requires opting out of iPad multitasking
        # (the iPhone app still runs on iPad, full screen).
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Lets dev builds reach http://localhost and LAN addresses; HTTPS everywhere else.
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Kleidi connects to a development server on your local network.
        # Proof of a bank transfer and issue photos (localized in App/Resources/InfoPlist.xcstrings).
        NSCameraUsageDescription: Kleidi uses the camera to photograph your bank-transfer confirmation or an issue in your home.
    dependencies:
      - package: TenantKit
        product: TenantCore
      - package: TenantKit
        product: TenantAPI

schemes:
  KleidiTenant:
    build:
      targets:
        KleidiTenant: all
    run:
      config: Debug
    archive:
      config: Release
  KleidiTenant Stage:
    build:
      targets:
        KleidiTenant: all
    run:
      config: Stage
    archive:
      config: Stage
  # Runs the Release build (production server) in the simulator or on a device.
  KleidiTenant Prod:
    build:
      targets:
        KleidiTenant: all
    run:
      config: Release
    archive:
      config: Release
