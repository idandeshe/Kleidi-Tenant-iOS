name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests-linux:
    name: TenantKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/TenantKit

  app-build:
    name: Package tests + app build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: TenantKit tests (macOS)
        run: swift test --package-path Packages/TenantKit
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project KleidiTenant.xcodeproj -scheme KleidiTenant \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}
